app            = "tera5g-hs5d13"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV   = "production"
  PORT       = "3001"
  PROXY_PORT = "8080"

# Main web + Socket.io  ──  routed via Fly's HTTPS proxy
[[services]]
  internal_port = 3001
  protocol      = "tcp"

  [services.concurrency]
    type       = "connections"
    hard_limit = 50
    soft_limit = 40

  [[services.ports]]
    port        = 80
    handlers    = ["http"]
    force_https = true

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    grace_period = "10s"
    interval     = "15s"
    method       = "GET"
    path         = "/api/status"
    timeout      = "5s"

# HTTP proxy for device bypass  ──  raw TCP, port 8080
[[services]]
  internal_port = 8080
  protocol      = "tcp"

  [[services.ports]]
    port = 8080
