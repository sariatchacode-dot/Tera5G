app            = "tera5g"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV    = "production"
  PORT        = "3001"
  PROXY_PORT  = "8080"
  # Set ADMIN_KEY as a Fly secret — do NOT put the real value here:
  #   fly secrets set ADMIN_KEY=your-secret-key

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1

# ── Main web + Socket.io service (HTTPS) ─────────────────────────────────────
[http_service]
  internal_port       = 3001
  force_https         = true
  auto_stop_machines  = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 50
    soft_limit = 40

  [[http_service.checks]]
    grace_period = "10s"
    interval     = "15s"
    method       = "GET"
    path         = "/api/status"
    timeout      = "5s"

# ── HTTP proxy service (raw TCP — device bypass on port 8080) ─────────────────
[[services]]
  protocol      = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 8080
